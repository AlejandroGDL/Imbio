name: Build Windows Installer MAKEFILE

# Construye el instalador de Windows de IMBIO con Tauri 2 + npm.
# Se dispara:
#   - Manualmente desde la pestaña "Actions" de GitHub
#   - Automáticamente al pushear un tag que empiece con "v" (ej. v0.1.0)
#
# Artefactos generados (en src-tauri/target/release/bundle/):
#   - .msi  → Windows Installer (WiX)
#   - .exe  → NSIS installer
#
# Secrets opcionales (Settings → Secrets → Actions):
#   - TAURI_SIGNING_PRIVATE_KEY
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Cancela builds en curso si llega un nuevo push/tag al mismo ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: "always"
  NODE_VERSION: "22"
  RUST_VERSION: "stable"

# Permisos mínimos: lectura por defecto, escritura solo cuando se
# crea el release (lo controla el step condicional con su propio token)
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Node.js 22 (caché basado en package-lock.json raíz)
      # ------------------------------------------------------------
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      # ------------------------------------------------------------
      # 3. Rust estable (Tauri shell)
      # ------------------------------------------------------------
      - name: 🦀 Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # ------------------------------------------------------------
      # 4. Caché de Cargo target/ (Tauri compila Rust; ahorra ~5 min)
      # ------------------------------------------------------------
      - name: 🗄️ Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # ------------------------------------------------------------
      # 5. Instalar dependencias (raíz + server/ via workspaces)
      # ------------------------------------------------------------
      - name: 📚 Install npm dependencies
        run: npm ci --legacy-peer-deps

      # ------------------------------------------------------------
      # 6. Generar cliente Prisma
      # ------------------------------------------------------------
      - name: 🗄️ Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      # ------------------------------------------------------------
      # 7. Verificar versión (útil para debug en logs de CI)
      # ------------------------------------------------------------
      - name: ℹ️  Show versions
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      # ------------------------------------------------------------
      # 8. Type-check del frontend (bloquea si falla)
      # ------------------------------------------------------------
      - name: 🟦 TypeScript check
        run: npx tsc --noEmit

      # ------------------------------------------------------------
      # 9. Build de Tauri (vite build + cargo build --release + bundle)
      # ------------------------------------------------------------
      - name: 🔨 Build Tauri app
        run: npm run tauri build -- --verbose

      # ------------------------------------------------------------
      # 10. Listar artefactos (para verificar en logs)
      # ------------------------------------------------------------
      - name: 📋 List build artifacts
        shell: bash
        run: |
          echo "=== Instaladores generados ==="
          find "src-tauri/target/release/bundle" -type f \( \
            -name "*.msi" -o -name "*.exe" -o -name "*.appx" \
          \) 2>/dev/null || echo "⚠️ No se encontraron instaladores"

      # ------------------------------------------------------------
      # 11. Subir instaladores como artefactos descargables
      #     (visibles 30 días en la pestaña Actions)
      # ------------------------------------------------------------
      - name: ⬆️  Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: imbio-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 12. Si es un tag, adjuntar instaladores al Release (draft)
      #     Permiso de escritura solo para este step
      # ------------------------------------------------------------
      - name: 📦 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Si quieres publicar en vez de draft, pon `draft: false`
          # o quítalo. Con draft puedes revisar antes de hacer público.
